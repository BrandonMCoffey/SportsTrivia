name: Game Tick (Live Updates)

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/30 * * * *'
  
  workflow_dispatch:

jobs:
  invoke-game-tick-live:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Supabase Live Function
        run: |
          curl -X POST '${{ secrets.SUPABASE_FUNCTION_URL }}/game-tick-live' \
          -H 'apiKey: ${{ secrets.SUPABASE_ANON_KEY }}' \
          -H 'Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' \
          -H 'Content-Type: application/json' \
          --data '{}'
